# Compile l'App Bundle (.aab) signé, prêt à être envoyé dans la Play Console.
#
# Déclenchement : UNIQUEMENT à la main (jamais à un commit ni à un push) :
#   onglet « Actions » > « Build AAB » > « Run workflow », puis choisir la branche
#   (`main` par défaut) et valider.
#
# Avant de pousser une nouvelle version, augmente le `+N` de `version:` dans pubspec.yaml :
# la Play Console refuse un numéro de build déjà utilisé.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64    contenu de balamo-upload.jks encodé : base64 -w0 ~/balamo-upload.jks
#   ANDROID_KEYSTORE_PASSWORD  storePassword  (android/key.properties)
#   ANDROID_KEY_PASSWORD       keyPassword    (android/key.properties)
#   ANDROID_KEY_ALIAS          keyAlias       (android/key.properties, « upload »)
name: Build AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Même version de Flutter que celle utilisée pour développer (voir docs/01-installation.md).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Dépendances, analyse et tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "Secret manquant : $v" >&2; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balamo-upload.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/balamo-upload.jks"
          } > android/key.properties

      - name: Compiler l'App Bundle
        run: flutter build appbundle --release

      # Sans key.properties, Gradle signerait avec la clé de debug (refusée par le Play Store).
      - name: Vérifier la signature
        run: |
          OWNER="$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'Owner:')"
          echo "$OWNER"
          if echo "$OWNER" | grep -qi 'Android Debug'; then
            echo "Le bundle est signé avec la clé de debug." >&2
            exit 1
          fi
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Supprimer la clé de signature du runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/balamo-upload.jks"

      - name: Lire la version
        id: version
        run: |
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr '+' '-')"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: balamo-aab-${{ steps.version.outputs.name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
